name: release

# Push a tag like v1.0.1 (matching mod_version in gradle.properties) to publish a release.
# Modrinth: create the project once on modrinth.com, then add the repository variable MODRINTH_ID
# and the secret MODRINTH_TOKEN (Settings > Secrets and variables > Actions). Without them only the
# GitHub release is made.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build
        run: ./gradlew build
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          body_path: CHANGELOG.md
      - name: Modrinth
        if: ${{ vars.MODRINTH_ID != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/!(*-sources).jar
          name: Fabric Hot Reload ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: fabric
          game-versions: 26.3
          dependencies: fabric-api(required)
