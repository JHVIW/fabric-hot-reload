<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --term-bg: rgba(16, 14, 28, 0.88);
    --accent: #ffd540;
    --green: #55ff55;
    --pink: #ff6bd6;
    --muted: #a9a3c4;
  }
  html, body { margin: 0; width: 1600px; height: 900px; overflow: hidden; background: #000; }
  .stage { position: relative; width: 1600px; height: 900px; }
  .shot { position: absolute; inset: 0; width: 1600px; height: 900px; }
  /* darken the right half a little so text reads, keep the game HUD/chat on the left untouched */
  .shade { position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(0,0,0,0) 38%, rgba(10,8,24,0.55) 62%, rgba(10,8,24,0.72) 100%); }
  .panel { position: absolute; right: 64px; top: 92px; width: 700px; color: #fff; font-family: Inter, sans-serif; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { width: 88px; height: 88px; image-rendering: pixelated; border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.45); }
  h1 { margin: 0; font-size: 62px; font-weight: 800; letter-spacing: -1.5px; line-height: 1;
    text-shadow: 0 4px 18px rgba(0,0,0,0.5); }
  .tag { margin: 26px 0 30px; font-size: 30px; font-weight: 500; line-height: 1.3; color: #f1eefc;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6); }
  .tag b { color: var(--accent); font-weight: 800; }
  .term { background: var(--term-bg); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.55); overflow: hidden; }
  .bar { display: flex; gap: 8px; padding: 12px 16px; background: rgba(255,255,255,0.06); }
  .bar i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .bar i:nth-child(1) { background: #ff5f57; } .bar i:nth-child(2) { background: #febc2e; } .bar i:nth-child(3) { background: #28c840; }
  pre { margin: 0; padding: 18px 22px 22px; font-family: "JetBrains Mono", monospace; font-size: 21px; line-height: 1.6; color: #e8e6f3; white-space: pre-wrap; }
  .p { color: var(--muted); } .c { color: #fff; font-weight: 700; }
  .ok { color: var(--green); } .hr { color: var(--pink); }
  .foot { margin-top: 22px; font-size: 20px; color: #d9d4ee; text-shadow: 0 2px 10px rgba(0,0,0,0.6); }
</style>
</head>
<body>
<div class="stage">
  <img class="shot" src="2-live-edit.png" alt="">
  <div class="shade"></div>
  <div class="panel">
    <div class="brand"><img src="../../src/main/resources/assets/hotreload/icon.png" alt=""><h1>Fabric Hot Reload</h1></div>
    <div class="tag">Edit your mod. See it in-game.<br><b>No restart.</b></div>
    <div class="term">
      <div class="bar"><i></i><i></i><i></i></div>
<pre><span class="p">$</span> <span class="c">./gradlew hotReload</span>
<span class="hr">Hot Reload:</span> <span class="ok">Loaded new mod: Hello Hot Reload</span>

<span class="p"># change the HUD text, run it again</span>
<span class="p">$</span> <span class="c">./gradlew hotReload</span>
<span class="hr">Hot Reload:</span> <span class="ok">Reloaded: HelloHotReload</span></pre>
    </div>
    <div class="foot">Code · Mixins · Resources · Whole new mods</div>
  </div>
</div>
</body>
</html>
